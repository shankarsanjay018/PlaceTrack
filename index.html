<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlaceTrack</title>

    <link rel="stylesheet"
          href="./static/css/placement-bg.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: #09090b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            background: #09090b;
        }

        .bg-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(99, 102, 241, 0.08) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(99, 102, 241, 0.08) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                rgba(0,0,0,0.9),
                rgba(0,0,0,0.25)
            );
        }

        #placement-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .page-content {
            position: relative;
            z-index: 2;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;
        }

        .hero {
            text-align: center;
            max-width: 900px;
        }

        .logo-title {
            font-size: clamp(48px, 7vw, 90px);
            font-weight: 800;
            letter-spacing: -3px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #c4b5fd,
                #a855f7
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 18px;
            font-size: clamp(18px, 2vw, 24px);
            color: #a1a1aa;
        }

        .description {
            margin-top: 18px;
            color: #71717a;
            font-size: 16px;
            line-height: 1.7;
        }

        .buttons {
            margin-top: 35px;

            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 13px 24px;
            border-radius: 12px;

            text-decoration: none;
            font-weight: 600;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6,
                #c026d3
            );

            color: white;

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.25);
        }

        .btn-secondary {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #e4e4e7;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- LIVE PLACE TRACK BACKGROUND -->
    <div class="page-bg">
        <div class="bg-grid"></div>
        <canvas id="placement-bg"></canvas>
    </div>

    <!-- CONTENT -->
    <main class="page-content">

        <section class="hero">

            <h1 class="logo-title">
                PlaceTrack
            </h1>

            <p class="subtitle">
                Student Placement Management System
            </p>

            <p class="description">
                Track applications, discover opportunities,
                manage your placement journey and stay organized
                throughout your career preparation.
            </p>

            <div class="buttons">
                <a href="#" class="btn btn-primary">
                    Explore PlaceTrack →
                </a>

                <a href="https://github.com/shankarsanjay018/PlaceTrack"
                   target="_blank"
                   class="btn btn-secondary">
                    View GitHub
                </a>
            </div>

        </section>

    </main>

    <!-- YOUR EXISTING LIVE BACKGROUND SCRIPT -->
    <script src="./static/js/placement-bg.js"></script>

</body>
</html>
