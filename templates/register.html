<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | PlaceTrack</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --bg: #09090b;
            --card: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 255, 255, 0.10);
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --input-bg: rgba(255, 255, 255, 0.045);
        }
        /* =====================================================
           BODY
        ===================================================== */
        
        body {
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #09090b;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }
        /* =====================================================
           ANIMATED BACKGROUND
        ===================================================== */
        
        .animated-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.28;
            will-change: transform;
        }
        
        .orb-one {
            width: 420px;
            height: 420px;
            top: -120px;
            left: -100px;
            background: rgba(99, 102, 241, 0.45);
            animation: moveOne 16s ease-in-out infinite alternate;
        }
        
        .orb-two {
            width: 500px;
            height: 500px;
            right: -180px;
            top: 10%;
            background: rgba(59, 130, 246, 0.35);
            animation: moveTwo 20s ease-in-out infinite alternate;
        }
        
        .orb-three {
            width: 380px;
            height: 380px;
            bottom: -120px;
            left: 25%;
            background: rgba(168, 85, 247, 0.30);
            animation: moveThree 18s ease-in-out infinite alternate;
        }
        
        .orb-four {
            width: 280px;
            height: 280px;
            right: 20%;
            bottom: 12%;
            background: rgba(34, 211, 238, 0.22);
            animation: moveFour 22s ease-in-out infinite alternate;
        }
        
        @keyframes moveOne {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(140px, 100px) scale(1.2);
            }
        }
        
        @keyframes moveTwo {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-130px, 90px) scale(1.15);
            }
        }
        
        @keyframes moveThree {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-100px, -80px) scale(1.2);
            }
        }
        
        @keyframes moveFour {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, -100px) scale(1.15);
            }
        }
        /* =====================================================
           GRID BACKGROUND
        ===================================================== */
        
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: linear-gradient( rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient( 90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient( ellipse at center, black 15%, transparent 75%);
            pointer-events: none;
            z-index: 1;
        }
        /* =====================================================
           CURSOR TRAIL
        ===================================================== */
        
        #cursorCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        /* =====================================================
           AUTH WRAPPER
        ===================================================== */
        
        .auth-wrapper {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 5;
        }
        /* =====================================================
           BRAND
        ===================================================== */
        
        .brand {
            text-align: center;
            margin-bottom: 22px;
        }
        
        .brand-icon {
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: linear-gradient( 135deg, #6366f1, #8b5cf6);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.35);
            color: white;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 11px;
        }
        
        .brand-name {
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.7px;
        }
        
        .brand-name span {
            color: var(--primary-light);
        }
        /* =====================================================
           CARD
        ===================================================== */
        
        .auth-card {
            position: relative;
            background: linear-gradient( 145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035));
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            padding: 34px 36px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        /* Animated border */
        
        .auth-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient( 120deg, transparent 15%, rgba(99, 102, 241, 0.45), transparent 45%, rgba(56, 189, 248, 0.25), transparent 75%);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
            animation: borderMove 6s linear infinite;
        }
        
        @keyframes borderMove {
            0% {
                transform: translateX(-15%);
            }
            50% {
                transform: translateX(15%);
            }
            100% {
                transform: translateX(-15%);
            }
        }
        
        .card-content {
            position: relative;
            z-index: 3;
        }
        /* =====================================================
           HEADING
        ===================================================== */
        
        .auth-card h1 {
            font-size: 27px;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        /* =====================================================
           FORM
        ===================================================== */
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            color: #d4d4d8;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s, background 0.2s;
        }
        
        input::placeholder {
            color: #71717a;
        }
        
        input:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }
        
        input:focus {
            background: rgba(255, 255, 255, 0.065);
            border-color: rgba(99, 102, 241, 0.75);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }
        /* =====================================================
           BUTTON
        ===================================================== */
        
        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: none;
            border-radius: 10px;
            background: linear-gradient( 135deg, #6366f1, #7c3aed);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.20);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.32);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        /* =====================================================
           LINKS
        ===================================================== */
        
        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 13px;
        }
        
        .bottom-text a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }
        
        .bottom-text a:hover {
            color: white;
            text-decoration: underline;
        }
        
        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #71717a;
            text-decoration: none;
            font-size: 12px;
        }
        
        .home-link:hover {
            color: white;
        }
        /* =====================================================
           MOBILE
        ===================================================== */
        
        @media (max-width: 500px) {
            body {
                padding: 16px;
            }
            .auth-wrapper {
                max-width: 100%;
            }
            .auth-card {
                padding: 27px 21px;
            }
            .auth-card h1 {
                font-size: 24px;
            }
            #cursorCanvas {
                display: none;
            }
        }
    </style>

</head>


<body>


    <!-- Animated Background -->

    <div class="animated-bg">

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="orb orb-three"></div>

        <div class="orb orb-four"></div>

    </div>


    <!-- Grid -->

    <div class="grid-bg"></div>


    <!-- Cursor Trail -->

    <canvas id="cursorCanvas"></canvas>



    <!-- =====================================================
         REGISTER CONTENT
    ====================================================== -->

    <div class="auth-wrapper">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">
                P
            </div>

            <div class="brand-name">
                Place<span>Track</span>
            </div>

        </div>



        <!-- CARD -->

        <div class="auth-card">

            <div class="card-content">


                <h1>
                    Create your account
                </h1>


                <p class="subtitle">

                    Start organizing your placement journey with PlaceTrack.

                </p>



                <form method="POST" action="/register">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="name">
                            FULL NAME
                        </label>

                        <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required>

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            EMAIL ADDRESS
                        </label>

                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>

                    </div>



                    <!-- COLLEGE -->

                    <div class="form-group">

                        <label for="college">
                            COLLEGE
                        </label>

                        <input type="text" id="college" name="college" placeholder="Your college name" autocomplete="organization" required>

                    </div>



                    <!-- SUBMIT -->

                    <button type="submit" class="submit-btn">

                        Create Account

                    </button>


                </form>



                <!-- LOGIN LINK -->

                <p class="bottom-text">

                    Already have an account?

                    <a href="/login">
                        Sign in
                    </a>

                </p>

            </div>

        </div>



        <!-- HOME -->

        <a href="/" class="home-link">

            ← Back to PlaceTrack

        </a>


    </div>



    <!-- =====================================================
         CURSOR TRAIL JAVASCRIPT
    ====================================================== -->

    <script>
        const canvas =
            document.getElementById("cursorCanvas");

        const ctx =
            canvas.getContext("2d");


        let mouse = {

            x: window.innerWidth / 2,

            y: window.innerHeight / 2

        };


        let points = [];



        /* Canvas resize */

        function resizeCanvas() {

            const dpr =
                window.devicePixelRatio || 1;

            canvas.width =
                window.innerWidth * dpr;

            canvas.height =
                window.innerHeight * dpr;

            canvas.style.width =
                window.innerWidth + "px";

            canvas.style.height =
                window.innerHeight + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );



        /* Mouse movement */

        window.addEventListener(
            "mousemove",
            (event) => {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;


                points.push({

                    x: mouse.x,

                    y: mouse.y,

                    life: 1

                });


                if (points.length > 35) {

                    points.shift();

                }

            }
        );



        /* Trail animation */

        function animateTrail() {

            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            for (
                let i = 0; i < points.length; i++
            ) {

                points[i].life *= 0.92;

            }


            points =
                points.filter(
                    point =>
                    point.life > 0.03
                );


            if (points.length > 1) {

                for (
                    let i = 0; i < points.length - 1; i++
                ) {

                    const current =
                        points[i];

                    const next =
                        points[i + 1];


                    const alpha =
                        current.life * 0.75;


                    ctx.beginPath();


                    ctx.strokeStyle =
                        `rgba(129, 140, 248, ${alpha})`;


                    ctx.lineWidth =
                        2.2 * current.life;


                    ctx.lineCap =
                        "round";


                    ctx.lineJoin =
                        "round";


                    ctx.moveTo(
                        current.x,
                        current.y
                    );


                    ctx.lineTo(
                        next.x,
                        next.y
                    );


                    ctx.stroke();

                }

            }


            requestAnimationFrame(
                animateTrail
            );
        }


        animateTrail();
    </script>


</body>

</html>
